let state={items:{},days:{},sessions:0,settings:{tense:"all",length:10}};
try{const raw=localStorage.getItem(KEY);if(raw){const obj=JSON.parse(raw);if(obj&&obj.items&&obj.days&&obj.settings)state={...state,...obj};}}catch(e){storageOK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false}}
const day=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")};
const record=q=>state.items[q.id]||{seen:0,ok:0,streak:0,wrong:false,due:0};
const errors=()=>bank.filter(q=>record(q).wrong);
const due=()=>bank.filter(q=>record(q).seen&&record(q).due<=Date.now());
let page="inicio",session=null,feedback=null,opts=[];
function render(content,focus=true){main.innerHTML=content;document.querySelectorAll("nav button").forEach(b=>{if(b.dataset.page===page)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});if(focus)main.focus();}
function navigate(p){if(session&&session.index<session.questions.length&&!confirm("¿Salir de la sesión? Las respuestas ya registradas se conservarán."))return;session=null;feedback=null;page=p;if(p==="inicio")home();if(p==="teoria")theory();if(p==="errores")review();if(p==="progreso")progress();}
$("#homeBrand").addEventListener("click",()=>navigate("inicio"));document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.page)));
function stats(){const all=Object.values(state.items),n=all.reduce((a,x)=>a+x.seen,0),ok=all.reduce((a,x)=>a+x.ok,0);return {n,ok,accuracy:n?Math.round(ok*100/n):0,unique:all.length,mastered:all.filter(x=>x.streak>=3).length};}
function home(){const s=stats();render('<div class="eyebrow">Tu espacio de aprendizaje</div><h1>El subjuntivo,<br>sin pensarlo dos veces.</h1><p class="lead">Aprende a elegir el modo y el tiempo adecuados. Practica unos minutos, entiende tus errores y vuelve mañana.</p><div class="stats"><div class="stat"><b>'+s.n+'</b><small>Respuestas</small></div><div class="stat"><b>'+ (s.n?s.accuracy+" %":"—")+'</b><small>Aciertos</small></div><div class="stat"><b>'+errors().length+'</b><small>Por corregir</small></div></div><div class="settings"><label>Tiempo verbal<select id="tense"><option value="all">Todos los tiempos</option>'+T.map((t,i)=>'<option value="'+i+'">'+esc(t)+'</option>').join("")+'</select></label><label>Preguntas por sesión<select id="length"><option value="5">5 preguntas</option><option value="10">10 preguntas</option><option value="20">20 preguntas</option></select></label></div><button class="primary" id="daily">Empezar práctica variada</button><div class="grid">'+[["01","conj","Domina las formas verbales, regulares e irregulares."],["02","context","Escribe la forma que mejor encaja en la frase."],["03","mood","Distingue lo afirmado de lo deseado, dudoso o hipotético."],["04","reason","Identifica la razón gramatical de cada construcción."]].map(x=>'<button class="tile" data-mode="'+x[1]+'"><span class="num">'+x[0]+'</span><strong>'+M[x[1]]+'</strong><small>'+x[2]+'</small></button>').join("")+'</div><button class="secondary" id="repaso">Repasar errores y preguntas pendientes ('+new Set([...errors(),...due()].map(q=>q.id)).size+')</button><p class="notice">'+bank.length+' ejercicios · Cuatro tiempos de uso actual · Variantes en -ra y -se aceptadas. '+(storageOK?"Los avances se guardan en este navegador.":"No se puede guardar el progreso en este navegador.")+'</p>');
$("#tense").value=state.settings.tense;$("#length").value=String(state.settings.length);$("#tense").onchange=e=>{state.settings.tense=e.target.value;save()};$("#length").onchange=e=>{state.settings.length=Number(e.target.value);save()};$("#daily").onclick=()=>start("mixed");$("#repaso").onclick=()=>navigate("errores");document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>start(b.dataset.mode));}
function choose(mode,tense,n){let pool=bank.filter(q=>(mode==="mixed"||mode==="review"||q.mode===mode)&&(tense==="all"||q.t===Number(tense)));if(mode==="review")pool=pool.filter(q=>record(q).wrong||(record(q).seen&&record(q).due<=Date.now()));const priority=q=>{const r=record(q);return (r.wrong?4:0)+(r.seen&&r.due<=Date.now()?3:0)+(!r.seen?2:0)};
function pick(p){return mix(p).sort((a,b)=>priority(b)-priority(a))}
if(mode==="mixed"){const groups=["context","mood","conj","reason"].map(m=>pick(pool.filter(q=>q.mode===m)));const out=[];while(out.length<n&&groups.some(g=>g.length)){for(const g of groups)if(g.length&&out.length<n)out.push(g.shift())}return mix(out)}
return pick(pool).slice(0,n);}
function start(mode){const qs=choose(mode,mode==="review"?"all":state.settings.tense,state.settings.length);if(!qs.length){navigate("errores");return;}page="practica";session={mode,questions:qs,index:0,ok:0,missed:[]};feedback=null;showQuestion();}
function markupPrompt(s){return esc(s).replace("___",'<span class="blank">______</span>');}
function showQuestion(){const q=session.questions[session.index],n=session.questions.length;feedback=null;opts=q.options?mix(q.options):q.mode==="reason"?mix([q.answers[0],...mix(Object.entries(DATA.categories).filter(([k])=>k!==q.category&&["hecho","habito","real","concesionreal"].indexOf(k)<0).map(([,v])=>v[0])).slice(0,3)]):[];
render('<div class="topline"><span>'+esc(M[session.mode])+' · '+(session.index+1)+' de '+n+'</span><span>'+session.ok+' aciertos</span></div><div class="progress" role="progressbar" aria-label="Progreso de la sesión" aria-valuenow="'+session.index+'" aria-valuemin="0" aria-valuemax="'+n+'"><i style="width:'+100*session.index/n+'%"></i></div><section class="panel"><div class="eyebrow">'+esc(M[q.mode])+'</div><h1 class="question">'+markupPrompt(q.prompt)+'</h1><p class="muted">'+esc(q.help)+'</p>'+(opts.length?'<div class="options">'+opts.map((o,i)=>'<button class="option" data-option="'+i+'">'+esc(o)+'</button>').join("")+'</div>':'<form id="answerForm"><label for="answer">Tu respuesta</label><input id="answer" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Escribe aquí" required><div class="accents" aria-label="Caracteres especiales">'+["á","é","í","ó","ú","ü","ñ"].map(c=>'<button type="button" data-accent="'+c+'">'+c+'</button>').join("")+'</div><div class="actions"><button class="primary" id="check" type="submit">Comprobar</button><button class="ghost" type="button" id="skip">No lo sé</button></div></form>')+'<div id="response" aria-live="polite"></div></section><div class="actions"><button class="ghost" id="exit">← Salir de la sesión</button></div>');
$("#exit").onclick=()=>navigate("inicio");document.querySelectorAll("[data-option]").forEach(b=>b.onclick=()=>answer(opts[Number(b.dataset.option)]));const f=$("#answerForm");if(f){const input=$("#answer");f.onsubmit=e=>{e.preventDefault();if(norm(input.value))answer(input.value)};$("#skip").onclick=()=>answer("");document.querySelectorAll("[data-accent]").forEach(b=>b.onclick=()=>{const start=input.selectionStart??input.value.length,end=input.selectionEnd??start;input.setRangeText(b.dataset.accent,start,end,"end");input.focus()});}}
function answer(value){if(feedback)return;const q=session.questions[session.index];const ok=q.answers.some(a=>norm(a)===norm(value));feedback={ok,value};const r=record(q),streak=ok?r.streak+1:0;const intervals=[1,3,7,14,30];state.items[q.id]={seen:r.seen+1,ok:r.ok+(ok?1:0),streak,wrong:!ok,due:Date.now()+(ok?intervals[Math.min(streak-1,4)]*86400000:0)};const d=day();state.days[d]=(state.days[d]||0)+1;save();if(ok)session.ok++;else session.missed.push(q);document.querySelectorAll("[data-option]").forEach(b=>{const v=opts[Number(b.dataset.option)];b.disabled=true;if(q.answers.includes(v))b.classList.add("correct");else if(v===value)b.classList.add("wrong")});document.querySelectorAll("#answerForm input,#answerForm button").forEach(b=>b.disabled=true);const accentOnly=!ok&&q.answers.some(a=>norm(a).normalize("NFD").replace(/\p{M}/gu,"")===norm(value).normalize("NFD").replace(/\p{M}/gu,""));$("#response").innerHTML='<div class="feedback '+(ok?"":"wrong")+'"><h3>'+(ok?"¡Bien hecho!":accentOnly?"Casi: revisa la acentuación.":"No pasa nada. Vamos a corregirlo.")+'</h3>'+(!ok&&value?'<p>Tu respuesta: '+esc(value)+'</p>':"")+'<p><strong>'+(ok?"Respuesta":"Respuesta correcta")+':</strong> '+q.answers.map(esc).join(" / ")+'</p><p>'+esc(q.why)+'</p></div><div class="actions"><button class="primary" id="next">'+(session.index+1===session.questions.length?"Ver resultados":"Siguiente pregunta")+' →</button></div>';$("#next").onclick=next;$("#next").focus();}
function next(){session.index++;feedback=null;if(session.index===session.questions.length){state.sessions++;save();finish()}else showQuestion()}
function finish(){const n=session.questions.length,ok=session.ok,missed=session.missed;render('<div class="eyebrow">Sesión terminada</div><h1>'+ok+' de '+n+'</h1><p class="lead">'+(ok===n?"¡Excelente! Has acertado todas las preguntas.":ok>=n/2?"Vas por buen camino. Repasa lo que todavía cuesta.":"Cada error es una oportunidad de aprender. Vuelve a intentarlo.")+'</p><div class="progress"><i style="width:'+100*ok/n+'%"></i></div><section class="panel"><h2>'+(missed.length?"Lo que conviene repasar":"¡Sin errores!")+'</h2>'+ (missed.length?'<ul class="errorlist">'+missed.map(q=>'<li>'+markupPrompt(q.prompt)+'<br><strong>'+q.answers.map(esc).join(" / ")+'</strong><br><small class="muted">'+esc(q.why)+'</small></li>').join("")+'</ul>':'<p>Volverás a ver estas preguntas en los próximos días.</p>')+'</section><div class="actions"><button class="primary" id="again">Otra sesión</button><button class="secondary" id="back">Volver al inicio</button></div>');$("#again").onclick=()=>start(session.mode==="review"?"mixed":session.mode);$("#back").onclick=()=>navigate("inicio")}
function review(){const err=errors(),pending=due(),count=new Set([...err,...pending].map(q=>q.id)).size;render('<div class="eyebrow">Repetición espaciada</div><h1>Repaso.</h1><p class="lead">Las preguntas falladas vuelven inmediatamente. Las acertadas se programan para dentro de 1, 3, 7, 14 o 30 días, según tu racha de aciertos en cada pregunta.</p><div class="stats"><div class="stat"><b>'+err.length+'</b><small>Errores pendientes</small></div><div class="stat"><b>'+pending.length+'</b><small>Repasos vencidos (incluye errores)</small></div><div class="stat"><b>'+count+'</b><small>Total para repasar</small></div></div><button class="primary" id="startReview" '+(!count?"disabled":"")+'>Empezar repaso</button>'+(err.length?'<h2 style="margin-top:28px">Últimos errores pendientes</h2><ul class="errorlist">'+err.slice(0,30).map(q=>'<li>'+markupPrompt(q.prompt)+'<br><span class="muted">'+esc(M[q.mode])+'</span></li>').join("")+'</ul>':'<p class="notice">No tienes errores pendientes. Si no hay repasos vencidos, puedes seguir practicando desde Inicio.</p>'));$("#startReview").onclick=()=>start("review");}
function theory(){render('<div class="eyebrow">Gramática de consulta</div><h1>Guía del subjuntivo.</h1><p class="lead">No es el modo de lo irreal sin más: importa cómo presenta el hablante la información y qué construcción utiliza.</p>'+[
["1 · Presente","Acciones presentes o futuras dependientes de un deseo, duda, valoración, finalidad, condición o referencia aún no realizada.","Espero que vengas mañana. · Te llamaré cuando llegue.","hablar: hable, hables, hable, hablemos, habléis, hablen. Comer: coma, comas, coma, comamos, comáis, coman. Vivir: viva, vivas, viva, vivamos, viváis, vivan."],
["2 · Imperfecto","Acciones dependientes de un contexto pasado o condicional; también hipótesis presentes o futuras con si y deseos difíciles.","Quería que vinieras. · Si tuviera tiempo, viajaría.","Parte de la tercera persona plural del indefinido: tuvieron → tuvie- → tuviera / tuviese. En nosotros: tuviéramos / tuviésemos."],
["3 · Pretérito perfecto","Acciones anteriores a un punto de referencia presente o futuro, vistas desde una construcción que exige subjuntivo.","Me alegra que hayas venido. · Cuando hayas terminado, avísame.","haya, hayas, haya, hayamos, hayáis, hayan + participio. Participios irregulares frecuentes: hecho, dicho, visto, puesto, escrito, vuelto, abierto."],
["4 · Pluscuamperfecto","Acciones anteriores a un momento pasado o a una hipótesis contraria a los hechos.","Me sorprendió que hubieras venido. · Si lo hubiera sabido, habría ido.","hubiera / hubiese, hubieras / hubieses, hubiera / hubiese, hubiéramos / hubiésemos, hubierais / hubieseis, hubieran / hubiesen + participio."],
["5 · Indicativo frente a subjuntivo","El modo no depende solamente del verbo principal. La negación, la finalidad, la interpretación del referente y el momento temporal pueden cambiarlo.","Creo que es verdad / No creo que sea verdad. · Cuando llega, me llama / Cuando llegue, me llamará.","Aunque llueve (hecho afirmado) / Aunque llueva (posibilidad). Busco a alguien que sepa hacerlo / Conozco a alguien que sabe hacerlo."],
["6 · Atención a las construcciones con si","Para condiciones reales o abiertas: si + indicativo. Para hipótesis presentes o futuras: si + imperfecto de subjuntivo. Para hipótesis pasadas contrarias a los hechos: si + pluscuamperfecto.","Si tengo tiempo, iré. · Si tuviera tiempo, iría. · Si hubiera tenido tiempo, habría ido.","En estas construcciones condicionales no se usa el presente de subjuntivo inmediatamente después de si."],
["7 · Concordancia temporal","La elección del tiempo depende del momento de referencia y de la relación temporal entre los hechos. Estas correspondencias son frecuentes, no reglas mecánicas.","Espero que vengas / Esperaba que vinieras. · Me alegra que hayas venido / Me alegró que hubieras venido.","El contexto puede justificar otras combinaciones. Por ejemplo, un hecho aún vigente puede expresarse en presente aunque la oración principal esté en pasado."]
].map((l,i)=>'<details class="panel lesson" '+(i===0?"open":"")+'><summary>'+esc(l[0])+'</summary><p>'+esc(l[1])+'</p><p><strong>'+esc(l[2])+'</strong></p><p>'+esc(l[3])+'</p></details>').join("")+'<section class="panel"><h2>Motivos frecuentes</h2><table><thead><tr><th>Construcción</th><th>Uso</th></tr></thead><tbody>'+Object.entries(DATA.categories).filter(([k])=>!["hecho","habito","real","concesionreal"].includes(k)).map(([,v])=>'<tr><td>'+esc(v[0])+'</td><td>'+esc(v[1])+'</td></tr>').join("")+'</tbody></table></section><div class="actions"><button class="primary" id="practice">Practicar ahora</button></div>');$("#practice").onclick=()=>start("mixed")}
function progress(){const s=stats(),dates=Object.keys(state.days).sort().reverse();render('<div class="eyebrow">Tu aprendizaje</div><h1>Progreso.</h1><div class="stats"><div class="stat"><b>'+s.n+'</b><small>Respuestas</small></div><div class="stat"><b>'+(s.n?s.accuracy+" %":"—")+'</b><small>Aciertos</small></div><div class="stat"><b>'+state.sessions+'</b><small>Sesiones completas</small></div></div><section class="panel"><h2>Por tiempo verbal</h2>'+T.map((t,i)=>{const rs=bank.filter(q=>q.t===i).map(record),n=rs.reduce((a,r)=>a+r.seen,0),ok=rs.reduce((a,r)=>a+r.ok,0);return '<div class="topline"><strong>'+esc(t)+'</strong><span>'+(n?Math.round(100*ok/n)+" % · "+n+" respuestas":"Sin practicar")+'</span></div><div class="progress"><i style="width:'+(n?100*ok/n:0)+'%"></i></div>'}).join("")+'<p class="muted">'+s.unique+' preguntas distintas practicadas · '+s.mastered+' con al menos tres aciertos consecutivos.</p></section><section class="panel" style="margin-top:15px"><h2>Actividad reciente</h2>'+(dates.length?'<ul class="errorlist">'+dates.slice(0,14).map(d=>'<li>'+esc(d.split("-").reverse().join("/"))+' · '+state.days[d]+' respuestas</li>').join("")+'</ul>':'<p class="muted">Todavía no hay actividad.</p>')+'</section><div class="actions"><button class="secondary" id="export">Exportar progreso</button><label class="secondary" style="cursor:pointer">Importar progreso<input type="file" accept=".json,application/json" id="import" class="sr"></label><button class="ghost" id="reset">Borrar progreso</button></div><p class="notice">El progreso es local: utiliza la exportación y la importación si cambias de navegador o dispositivo. La importación sustituye el progreso actual.</p>');$("#export").onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download="subjuntivo-progreso.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$("#import").onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());const integer=n=>Number.isSafeInteger(n)&&n>=0; if(!v||!v.items||!v.days||!v.settings||!integer(v.sessions)||!["all","0","1","2","3"].includes(v.settings.tense)||![5,10,20].includes(v.settings.length)||!Object.entries(v.items).every(([id,r])=>Object.hasOwn(byId,id)&&r&&integer(r.seen)&&integer(r.ok)&&r.ok<=r.seen&&integer(r.streak)&&r.streak<=r.ok&&typeof r.wrong==="boolean"&&integer(r.due))||!Object.entries(v.days).every(([k,n])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&integer(n)))throw Error();if(confirm("¿Sustituir el progreso actual por el archivo importado?")){state=v;save();progress()}}catch(e){alert("No se ha podido importar. Selecciona un archivo de progreso válido.")}};$("#reset").onclick=()=>{if(confirm("¿Borrar todos tus avances? Esta acción no se puede deshacer.")){state={items:{},days:{},sessions:0,settings:{tense:"all",length:10}};save();progress()}};}
home();
</script></body></html>
